name: Fix header logo home link
on:
  push:
    paths:
      - .github/workflows/fix-logo-home.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make home logo navigate to site root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();old='<a class="brand" href="#inicio" aria-label="Osuna Carpintero">';assert s.count(old)==1;p.write_text(s.replace(old,'<a class="brand" href="/" aria-label="Osuna Carpintero">',1))
          Path('.github/workflows/fix-logo-home.yml').unlink()
          PY
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make the header logo link to the home page'
          git push
